name: Kotatsu-Redo CI Auto-Build

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: redo-plugin-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Build Tooling
        uses: actions/checkout@v4
        with:
          path: 'ci-repo'

      - name: Checkout Upstream
        uses: actions/checkout@v4
        with:
          repository: 'Kotatsu-Redo/kotatsu-parsers-redo'
          path: 'upstream'

      - name: Poll Upstream Delta
        id: check_update
        run: |
          set -euo pipefail
          UPSTREAM_COMMIT=$(git -C upstream rev-parse HEAD)
          API_REF=$(grep -hv '^#' ci-repo/ci/api-ref.txt | grep -v '^[[:space:]]*$' | tail -1)
          if [ -z "$API_REF" ]; then
            echo "ci/api-ref.txt has no '<owner>/<repo> <commit>' line" >&2
            exit 1
          fi
          echo "Upstream target: $UPSTREAM_COMMIT"
          echo "Client parser api: $API_REF"

          mkdir -p deploy
          curl -s -f "https://raw.githubusercontent.com/${{ github.repository }}/repo/upstream_commit.txt" > deploy/upstream_commit.txt || true
          curl -s -f "https://raw.githubusercontent.com/${{ github.repository }}/repo/compat_ref.txt" > deploy/compat_ref.txt || true

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger detected, forcing rebuild."
          elif [ "$(cat deploy/upstream_commit.txt 2>/dev/null)" = "$UPSTREAM_COMMIT" ] \
            && [ "$(cat deploy/compat_ref.txt 2>/dev/null)" = "$API_REF" ]; then
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_update=true" >> "$GITHUB_OUTPUT"
          echo "UPSTREAM_COMMIT=$UPSTREAM_COMMIT" >> "$GITHUB_ENV"
          echo "API_REF=$API_REF" >> "$GITHUB_ENV"

      - name: JDK 17
        if: steps.check_update.outputs.has_update == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Upstream moved the parsers onto "parsers-api v1" (the app owns the contract, parsers
      # ship as a signed dex bundle). This client still loads the older plugin shape, so the
      # parsers are compiled against the client's own parser api. See ci/api-ref.txt.
      - name: Make Parsers Compile Against The Client API
        if: steps.check_update.outputs.has_update == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ci-repo/ci/make_compatible.py upstream --token "$GITHUB_TOKEN"

      - name: Build JAR
        if: steps.check_update.outputs.has_update == 'true'
        run: |
          chmod +x upstream/gradlew
          cd upstream
          ./gradlew jar --no-daemon

      # Fails the run instead of publishing a plugin the client would load as zero sources.
      - name: Verify Plugin ABI
        if: steps.check_update.outputs.has_update == 'true'
        run: |
          JAR_FILE=$(ls upstream/build/libs/*.jar | grep -v -- '-contract\.jar$' | head -n 1)
          echo "Verifying $JAR_FILE"
          python3 ci-repo/ci/verify_plugin.py "$JAR_FILE" upstream

      - name: D8 Dex Engine Packaging
        if: steps.check_update.outputs.has_update == 'true'
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          D8_PATH="$BUILD_TOOLS_DIR/d8"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          if [ ! -f "$ANDROID_JAR" ]; then
            ANDROID_JAR=$(ls "$ANDROID_HOME"/platforms/*/android.jar | sort -V | tail -1)
          fi
          echo "d8: $D8_PATH"
          echo "android.jar: $ANDROID_JAR"

          cd upstream/build/libs
          JAR_FILE=$(ls *.jar | grep -v -- '-contract\.jar$' | head -n 1)
          echo "dexing $JAR_FILE"
          "$D8_PATH" --release --lib "$ANDROID_JAR" --output . "$JAR_FILE"
          jar cvf plugin.jar classes.dex

          mkdir -p ../../../deploy_new/apk
          cp plugin.jar ../../../deploy_new/apk/

          cat << 'EOF' > ../../../deploy_new/index.min.json
          [
            {
              "name": "Kotatsu-Redo Parsers",
              "pkg": "org.skepsun.kototoro.parsers.redo",
              "version": "1.0.${{ github.run_number }}",
              "code": ${{ github.run_number }},
              "apk": "plugin.jar",
              "lang": "all",
              "nsfw": 1
            }
          ]
          EOF
          echo "${{ env.UPSTREAM_COMMIT }}" > ../../../deploy_new/upstream_commit.txt
          echo "${{ env.API_REF }}" > ../../../deploy_new/compat_ref.txt

      - name: Push to Repo Deploy Branch
        if: steps.check_update.outputs.has_update == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy_new
          publish_branch: repo
          force_orphan: true
